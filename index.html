    :root {
      font-family: "Kaspersky Sans Display", Arial, "Helvetica Neue", sans-serif;
      color: #f1f5f7;
      background: #0e1b26;
      --muted: #b4c1c8;
      --line: #31414a;
      --teal: #50e3ce;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse 62rem 44rem at 94% 0%, #23887970, transparent 72%),
        radial-gradient(ellipse 52rem 38rem at 0% 100%, #29487f75, transparent 72%),
        linear-gradient(135deg, #0c1625 12%, #183641 61%, #111d30 100%);
    }

    .page {
      width: min(100% - 64px, 1160px);
      margin-inline: auto;
    }

    .site-header {
      background: #0d1923bb;
      border-bottom: 1px solid #536e785e;
    }

    .header-inner {
      min-height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .conference {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .025em;
    }

    .conference strong {
      color: var(--teal);
      font-size: 28px;
      letter-spacing: -.055em;
      line-height: 1;
    }

    .conference span {
      border-left: 1px solid #425059;
      padding-left: 12px;
    }

    .organizer {
      display: flex;
      flex: none;
      align-items: center;
      gap: 9px;
      color: #f1f5f7;
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
    }

    .organizer img {
      display: block;
      width: 36px;
      height: 36px;
    }

    main { padding-block: 46px 60px; }

    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: flex;
      align-items: center;
      min-height: 246px;
      padding: 42px 44px;
      border: 1px solid #344650;
      border-radius: 24px;
      background: linear-gradient(105deg, #1a242c 42%, #182e32 100%);
    }

    .hero::before {
      position: absolute;
      inset: 0 0 0 44%;
      z-index: -2;
      content: "";
      background:
        radial-gradient(ellipse at 75% 52%, #43e9ca1f, transparent 68%),
        radial-gradient(circle, #75d3c547 1px, transparent 1.4px) 0 0 / 18px 18px;
      mask-image: linear-gradient(90deg, transparent, #000 66%);
    }

    .circuit {
      position: absolute;
      inset: 0 0 0 auto;
      width: 36%;
      z-index: -1;
      opacity: .84;
    }

    .circuit span {
      position: absolute;
      right: 0;
      width: var(--width);
      height: var(--height);
      top: var(--top);
      border-top: 1px solid var(--trace);
      border-left: 1px solid var(--trace);
      border-top-left-radius: var(--radius);
    }

    .circuit span::after {
      position: absolute;
      bottom: -5px;
      left: -5px;
      width: 9px;
      height: 9px;
      border: 1px solid var(--trace);
      border-radius: 50%;
      background: #1b3538;
      box-shadow: 0 0 12px var(--glow, transparent);
      content: "";
    }

    .circuit span:nth-child(1) {
      --width: 48%;
      --height: 72px;
      --top: 26px;
      --radius: 21px;
      --trace: #349b94;
    }

    .circuit span:nth-child(2) {
      --width: 73%;
      --height: 95px;
      --top: 56px;
      --radius: 30px;
      --trace: #356c69;
    }

    .circuit span:nth-child(3) {
      --width: 62%;
      --height: 89px;
      --top: 92px;
      --radius: 23px;
      --trace: #41d9be;
      --glow: #48e5c89c;
    }

    .circuit span:nth-child(4) {
      --width: 32%;
      --height: 78px;
      --top: 132px;
      --radius: 17px;
      --trace: #7294df;
    }

    .hero-copy {
      position: relative;
      max-width: 700px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 5.4vw, 70px);
      font-weight: 700;
      line-height: .99;
      letter-spacing: -.052em;
    }

    h1 span { color: var(--teal); }

    .hero p {
      margin: 23px 0 0;
      color: #caD6dc;
      font-size: clamp(16px, 1.6vw, 19px);
      line-height: 1.45;
      text-wrap: pretty;
    }

    .hero .hero-reward {
      margin-top: 8px;
      color: #9ceede;
    }

    .levels {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      margin: 0;
      padding: 28px 0 0;
      list-style: none;
    }

    .levels::before {
      position: absolute;
      top: 0;
      left: calc((100% - 44px) / 6);
      right: calc((100% - 44px) / 6);
      height: 14px;
      border: 1px solid #3e575e;
      border-top: 0;
      border-radius: 0 0 10px 10px;
      content: "";
    }

    .level {
      --accent: #64efc2;
      --tint: #142e2b;
      position: relative;
      min-width: 0;
      padding: 21px 24px 26px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #19232b;
    }

    .level:nth-child(2) {
      --accent: #acbcff;
      --tint: #232d4a;
    }

    .level:nth-child(3) {
      --accent: #ffb080;
      --tint: #3c2a26;
    }

    .level::before {
      position: absolute;
      top: -15px;
      left: 50%;
      width: 1px;
      height: 14px;
      background: #3e575e;
      content: "";
    }

    .level:nth-child(2)::before { top: -29px; height: 28px; }

    .level::after {
      position: absolute;
      top: -4px;
      left: calc(50% - 3px);
      width: 7px;
      height: 7px;
      border: 1px solid var(--accent);
      border-radius: 50%;
      background: #19232b;
      content: "";
    }

    .level-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--tint);
      color: var(--accent);
    }

    .level h2 {
      margin: 0;
      font-size: clamp(16px, 1.8vw, 19px);
      line-height: 1.25;
      font-weight: 700;
    }

    .meter {
      display: flex;
      align-items: flex-end;
      gap: 3px;
    }

    .meter i {
      width: 4px;
      height: 7px;
      border-radius: 1px;
      background: currentColor;
    }

    .meter i:nth-child(2) { height: 11px; }
    .meter i:nth-child(3) { height: 15px; }
    .level:first-child .meter i:nth-child(n+2),
    .level:nth-child(2) .meter i:last-child { opacity: .24; }

    .qr-frame {
      width: min(100%, 268px);
      margin: 22px auto 0;
      padding: 22px;
      border: 1px solid #36444a;
      border-color: color-mix(in srgb, var(--accent) 30%, #36444a);
      border-radius: 18px;
      background: #1d1d1b;
      box-shadow: 0 0 0 4px var(--tint);
    }

    .qr-frame img {
      display: block;
      width: 100%;
      height: auto;
    }

    @media (max-width: 820px) {
      .page { width: min(100% - 40px, 1160px); }
      main { padding-block: 32px 44px; }
      .hero { min-height: 220px; padding: 33px 28px; }
      .circuit { opacity: .48; }
      .levels { gap: 14px; }
      .levels::before {
        left: calc((100% - 28px) / 6);
        right: calc((100% - 28px) / 6);
      }
      .level { padding-inline: 13px; }
      .level-heading { padding-inline: 9px; }
      .qr-frame { padding: 17px; }
    }

    @media (max-width: 660px) {
      .page { width: min(100% - 32px, 460px); }
      .header-inner { gap: 12px; }
      .conference { gap: 8px; }
      .conference span { padding-left: 8px; }
      .organizer { gap: 6px; font-size: 16px; }
      .organizer img { width: 30px; height: 30px; }
      .hero { min-height: auto; padding: 33px 22px; }
      .hero p { margin-top: 17px; }
      .circuit { display: none; }
      .levels { grid-template-columns: 1fr; gap: 18px; padding-top: 18px; }
      .levels::before, .level::before, .level::after { display: none; }
      .level { padding-inline: 21px; }
      .level-heading { padding-inline: 12px; }
